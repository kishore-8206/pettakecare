# =============================================================================
# PetCare Spring Boot Application Configuration (MySQL 8.x + JWT)
# =============================================================================
server.port=8080

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/petcare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration (Override JWT_SECRET in production with at least 32+ chars)
app.jwt.secret=${JWT_SECRET:PetCareSuperSecretJwtSigningKeyForLocalDevelopment2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Vite dev server on port 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
